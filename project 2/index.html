<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Currency Converter</title>
  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">


  <link rel="stylesheet" href="style.css">
</head>

<body> 
  <div class="container">
    <h2>Currency Converter</h2>

    <form action="">

      <div class="amount">
        <p> Enter amount</p>
        <input value="100" type="number" min="0" step="any">
      </div>

      <div class="dropdown">
        <div class="from">
          <p>from</p>
          <div class="select-container">
            <img src="https://flagsapi.com/US/flat/64.png" alt="">

            <select name="from" id="">
               

            </select>
          </div>

        </div>




        <i class="fa-solid fa-right-left swap"></i>





        <div class="to">
          <p>TO</p>
          <div class="select-container">
            <img src="https://flagsapi.com/IN/flat/64.png" alt="">

            <select name="to" id="">
               

            </select>
          </div>

        </div>


      </div>

      <div class="msg"> 1 USD= 94 INR</div>
      <button> Get Exchange</button>

    </form>
  </div>



  <script src="code.js"></script>
  <script src="script.js"></script>
</body>
 

</html>
