 
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cat Facts | Discover Something New</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <main class="container">
        <div class="cat-icon">🐱</div>

        <p class="tagline">DID YOU KNOW?</p>

        <h1>Cat <span>Facts</span></h1>

        <p class="subtitle">
            Discover the fascinating world of cats,
            one fact at a time.
        </p>

        <section class="fact-card">
            <div class="card-label">
                <span class="dot"></span>
                RANDOM CAT FACT
            </div>

            <p id="fact">
                Click the button below to discover your first cat fact!
            </p>

            <button id="button">
                <span>Get New Fact</span>
                <span class="arrow">→</span>
            </button>

            <p class="footer-text">Made with ❤️ for cat lovers</p>
        </section>
    </main>

</body>
</html>
