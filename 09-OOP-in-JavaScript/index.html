
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript OOP Concepts</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            line-height: 1.6;
            background: #f4f6f8;
            color: #222;
        }

        h1 {
            color: #2563eb;
        }

        section {
            background: white;
            padding: 20px;
            margin: 16px 0;
            border-radius: 10px;
        }

        button {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #output {
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            background: #111827;
            color: #d1fae5;
            padding: 16px;
            border-radius: 8px;
            min-height: 100px;
        }
    </style>
</head>
<body>
    <h1>JavaScript: OOP Concepts</h1>

    <p>
        Learn prototypes, classes, inheritance,
        method overriding, super, and error handling.
    </p>

    <section>
        <h2>College Website Demo</h2>
        <p id="website-data">Welcome to our college website!</p>

        <button id="view-button">View Website Data</button>
        <button id="edit-button">Edit Data (Admin)</button>
    </section>

    <section>
        <h2>Console Output</h2>
        <pre id="output">Click a button to run the demo.</pre>
    </section>

    <script src="script.js"></script>
</body>
</html>
